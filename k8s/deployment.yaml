apiVersion: apps/v1
kind: Deployment
metadata:
  name: isi-burger
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: isi-burger
  template:
    metadata:
      labels:
        app: isi-burger
    spec:
      containers:
      - name: app
        image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE}:${DOCKER_TAG}
        ports:
        - containerPort: 9000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        env:
        - name: APP_ENV
          value: "staging"
        - name: DB_HOST
          value: "mysql-service"
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config 