apiVersion: v1
kind: ServiceAccount
metadata:
  name: isi-burger-sa
  namespace: staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: isi-burger-role
  namespace: staging
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: isi-burger-rolebinding
  namespace: staging
subjects:
- kind: ServiceAccount
  name: isi-burger-sa
  namespace: staging
roleRef:
  kind: Role
  name: isi-burger-role
  apiGroup: rbac.authorization.k8s.io 